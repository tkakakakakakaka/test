<div class="dashboard-container fade-in">
  <div class="form-header">
    <span class="material-symbols-outlined header-icon">history_edu</span>
    <div class="header-text">
      <h1>Programmation Soutenance</h1>
      <p>Assignation du jury et détails logistiques</p>
    </div>
  </div>

  <div class="glass-card">
    <form (ngSubmit)="creer()" #soutenanceForm="ngForm">
      
      <div class="input-grid">
        <div class="input-group">
          <label><span class="material-symbols-outlined">event</span> Date et Heure</label>
          <input type="datetime-local" [(ngModel)]="formData.dateHeure" name="dateHeure" required>
        </div>

        <div class="input-group">
          <label><span class="material-symbols-outlined">map</span> Lieu ou Lien</label>
          <input type="text" [(ngModel)]="formData.salleOuLien" name="salleOuLien" placeholder="Salle ou URL">
        </div>
      </div>

      <div class="separator"></div>

      <div class="input-group full-width">
        <label><span class="material-symbols-outlined">person_search</span> Étudiant</label>
        <select [(ngModel)]="formData.etudiant" name="etudiant" required>
          <option value="" disabled selected>Choisir l'étudiant...</option>
          @for (e of etudiants; track e.id) {
            <option [value]="'/api/etudiants/' + e.id">{{ e.prenom }} {{ e.nom }}</option>
          }
        </select>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label><span class="material-symbols-outlined">co_present</span> Enseignant</label>
          <select [(ngModel)]="formData.enseignant" name="enseignant" required>
            <option value="" disabled selected>Choisir un enseignant...</option>
            @for (ens of enseignants; track ens.id) {
              <option [value]="'/api/enseignants/' + ens.id">{{ ens.prenom }} {{ ens.nom }}</option>
            }
          </select>
        </div>

        <div class="input-group">
          <label><span class="material-symbols-outlined">business_center</span> Tuteur Pro</label>
          <select [(ngModel)]="formData.tuteurPro" name="tuteurPro" required>
            <option value="" disabled selected>Choisir un tuteur...</option>
            @for (t of tuteurs; track t.id) {
              <option [value]="'/api/tuteur_pros/' + t.id">{{ t.prenom }} {{ t.nom }}</option>
            }
          </select>
        </div>
      </div>

      <button type="submit" class="main-submit-btn" [disabled]="!soutenanceForm.valid">
        Valider la planification
      </button>
    </form>
  </div>
</div>
